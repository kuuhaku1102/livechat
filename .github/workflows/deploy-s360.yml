name: Deploy LiveChat Directory Theme v2 to ConoHa WING (s360.jp)

on:
  push:
    branches: [ main ]      # main更新で自動デプロイ
  workflow_dispatch:         # 手動実行もOK

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ① リポジトリを取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # ② SSHセットアップ
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ③ SSH接続テスト
      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "echo '✅ SSH CONNECT OK' && hostname && pwd"

      # ④ SFTPデプロイ
      - name: Deploy Theme to ConoHa WING
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

          # GitHub のテーマフォルダパスに合わせて変更
          local_path: ./live-chat-directory-theme-v2/

          # ← s360.jp のテーマディレクトリ（ConoHa）
          remote_path: public_html/s360.jp/wp-content/themes/live-chat-directory-theme-v2/

          sftp_only: true
          delete_remote_files: false
          rsyncArgs: "--exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='.env' --exclude='.DS_Store'"
